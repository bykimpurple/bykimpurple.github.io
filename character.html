<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHARACTER | KIMPURPLE</title>
  <meta name="description" content="KIMPURPLE 캐릭터 상세 소개">
  <meta name="theme-color" content="#0d0a13">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem('kp-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/characters.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/common.js" defer></script>
  <script src="js/character.js" defer></script>
</head>
<body data-page="character" data-nav="characters">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header id="site-header"></header>

  <!-- 모든 캐릭터가 이 템플릿을 공유합니다: character.html?id=캐릭터ID -->
  <main id="main">
    <div class="container detail-top">
      <a class="back-link" href="characters.html">전체 캐릭터</a>
    </div>
    <div class="container" id="character-root"></div>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="이미지 크게 보기">
    <button class="lightbox__close icon-btn" type="button" data-action="close" aria-label="닫기">×</button>
    <button class="lightbox__nav lightbox__nav--prev icon-btn" type="button" data-action="prev" aria-label="이전 이미지">‹</button>
    <figure class="lightbox__figure">
      <img class="lightbox__img" alt="">
      <figcaption class="lightbox__caption"></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__nav--next icon-btn" type="button" data-action="next" aria-label="다음 이미지">›</button>
  </dialog>

  <footer id="site-footer"></footer>
</body>
</html>
